# ══════════════════════════════════════════════════════════════════════════════
# HybridEditDif — Training Config (MagicBrush)
# ══════════════════════════════════════════════════════════════════════════════
# MagicBrush: ~10k real human edits, instruction text berkualitas tinggi.
# Sangat bagus untuk fine-tuning setelah pretraining dengan OpenImages/COCO.

model:
  sd_model_path: "runwayml/stable-diffusion-v1-5"
  ddca_layers: 16
  image_size: 512
  clip_model: "ViT-H-14"
  text_model: "ViT-g-14"

dataset:
  type: "magicbrush"
  data_root: "./data"
  image_size: 512
  max_samples: null
  val_ratio: 0.05          # 5% untuk val (dataset kecil)

  magicbrush:
    split_dir: "magicbrush"

output_dir: "checkpoints/magicbrush"

training:
  num_epochs: 30
  batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-5    # Lebih kecil karena dataset kecil (fine-tuning style)
  lr_warmup_steps: 200
  weight_decay: 1.0e-4
  max_grad_norm: 1.0
  num_workers: 4

  image_dropout_prob: 0.05
  text_dropout_prob: 0.05

  lambda1: 1.0
  lambda2: 1.0

  mixed_precision: "bf16"

  checkpoint_dir: "checkpoints/magicbrush"
  save_every_n_steps: 500   # Lebih sering karena dataset kecil
  keep_last_n_checkpoints: 5
  resume_from_checkpoint: null

  log_every_n_steps: 20
  val_every_n_steps: 500
  use_wandb: false
  project_name: "HybridEditDif"
  run_name: "magicbrush-30ep"
